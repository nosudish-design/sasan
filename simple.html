<!DOCTYPE html>
<html>
<head>
    <title>3 Websites Linked to Images</title>
</head>
<body>

    <h1>Click a Picture to Visit the Website</h1>

    <!-- First Website: Google -->

        <img src="https://via.placeholder.com/200x120?text=Google" alt="Go to Google" width="200" height="120">

    </a>

    <hr>

    <!-- Third Website: YouTube -->

    <a href="https://www.youtube.com" target="_blank">
        <img src="https://via.placeholder.com/200x120?text=YouTube" alt="Go to YouTube" width="200" height="120">
    </a>

</body>
</html>
